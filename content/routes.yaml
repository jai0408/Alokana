# Upload in Ghost Admin → Settings → Labs → Routes.
# A post belongs to the first collection whose filter it matches.
routes:
  /: home   # home.hbs pulls cases and investigations itself; without this, / is a 404

collections:
  /investigations/:
    permalink: /investigations/{slug}/
    filter: tag:investigation
    template: investigations
  /cases/:
    permalink: /cases/{slug}/
    filter: tag:case
    template: cases
  /notes/:
    permalink: /notes/{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
